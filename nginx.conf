server {
    listen 80;
    server_name eventos.jucepi.pi.gov.br;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Bloqueia arquivos ocultos (.git, .env etc.)
    location ~ /\. {
        deny all;
        return 404;
    }

    # Páginas, estilos e scripts: o navegador sempre confere se há versão nova
    # (evita ficar com CSS/JS antigo depois de uma atualização do site)
    location ~* \.(html|css|js)$ {
        add_header Cache-Control "no-cache";
    }

    # API de inscrições (serviço enaj-api no docker-compose)
    location /api/ {
        proxy_pass http://enaj-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 16k;
    }


    location ~* \.pdf$ {
        add_header Content-Type application/pdf;
        add_header Content-Disposition "inline; filename=$request_filename";
    }

    # Configuração para lidar com arquivos .webp
    location ~* \.(webp)$ {
        add_header Content-Type image/webp;
    }

}
