services:
  enaj-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: enaj_web_server
    restart: always
    ports:
      - "8081:80"
    environment:
      - TZ=America/Fortaleza
    depends_on:
      - enaj-api
    networks:
      - enaj_network

  enaj-api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: enaj_api
    restart: always
    environment:
      - TZ=America/Fortaleza
      - DB_PATH=/data/inscricoes.db
      # Usuário e senha da exportação (definidos no arquivo .env, fora do git)
      - ADMIN_USUARIO=${ADMIN_USUARIO:-admin}
      - ADMIN_SENHA=${ADMIN_SENHA:-}
    volumes:
      - enaj_data:/data
    networks:
      - enaj_network

networks:
  enaj_network:
    driver: bridge

volumes:
  enaj_data:
